spring:
  application:
    name: dental-backend
  datasource:                       # runtime: NON-superuser role without BYPASSRLS, or RLS is skipped
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dental}
    username: ${DB_APP_USER:dental_app}
    password: ${DB_APP_PASSWORD:}
  flyway:                           # migrations run as the schema owner, separate from runtime
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dental}
    user: ${DB_OWNER_USER:postgres}
    password: ${DB_OWNER_PASSWORD:}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate:
        jdbc.time_zone: UTC

# Spring MVC DEBUG logs can include request/response bodies, which may contain identity
# tokens, patient demographics, guardians, or clinical history. Keep web body diagnostics
# out of normal logs even if an ambient DEBUG flag enables other framework diagnostics.
logging:
  level:
    org.springframework.web: INFO

app:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    jwt-secret: ${APP_JWT_SECRET:}
    cookie-secure: ${APP_COOKIE_SECURE:true}
    # Exact browser origins permitted to make credentialed auth requests.
    allowed-origins: ${APP_ALLOWED_ORIGINS:}
    google-jwk-set-uri: ${GOOGLE_JWK_SET_URI:}
    platform-admin-emails: ${CLINIC_PLATFORM_ADMIN_EMAILS:}
    login-requests-per-minute: ${APP_AUTH_LOGIN_RPM:10}
    refresh-requests-per-minute: ${APP_AUTH_REFRESH_RPM:30}

  onboarding:
    # Open registration must be explicitly enabled after abuse controls/operational checks.
    self-service-enabled: ${APP_ONBOARDING_SELF_SERVICE:false}
