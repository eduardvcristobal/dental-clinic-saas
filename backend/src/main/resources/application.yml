spring:
  application:
    name: dental-backend
  datasource:                       # runtime: NON-superuser role without BYPASSRLS, or RLS is skipped
    url: jdbc:postgresql://localhost:5432/dental
    username: dental_app
    password: ${DB_APP_PASSWORD:app}
  flyway:                           # migrations run as the schema owner, separate from runtime
    url: jdbc:postgresql://localhost:5432/dental
    user: ${DB_OWNER_USER:postgres}
    password: ${DB_OWNER_PASSWORD:postgres}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate:
        jdbc.time_zone: UTC
