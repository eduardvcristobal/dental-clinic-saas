name: Backend Java 17
on:
  push:
  pull_request:
jobs:
  java17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dental
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dental"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Create disposable integration and upgrade databases
        env:
          PGPASSWORD: ci-owner-password
        run: |
          for database in dental_m04_migration dental_m25_upgrade dental_m310_upgrade dental_m310_scheduling dental_m4_upgrade; do
            createdb -h localhost -U postgres "$database"
          done
      - name: Run backend unit and PostgreSQL integration tests on JDK 17
        working-directory: backend
        env:
          APP_JWT_SECRET: 'ci-only-strong-secret-not-for-real-deployment-123456789'
          DB_URL: jdbc:postgresql://localhost:5432/dental
          DB_OWNER_USER: postgres
          DB_OWNER_PASSWORD: ci-owner-password
          DB_APP_USER: dental_app
          DB_APP_PASSWORD: ci-app-password
          APP_ALLOWED_ORIGINS: http://localhost:5173
          M04_AUTH_TEST_DB_URL: jdbc:postgresql://localhost:5432/dental
          M04_AUTH_TEST_OWNER_USER: postgres
          M04_AUTH_TEST_OWNER_PASSWORD: ci-owner-password
          M04_AUTH_TEST_APP_USER: dental_app
          M04_AUTH_TEST_APP_PASSWORD: ci-app-password
          M04_MIGRATION_TEST_DB_URL: jdbc:postgresql://localhost:5432/dental_m04_migration
          M04_MIGRATION_TEST_OWNER_USER: postgres
          M04_MIGRATION_TEST_OWNER_PASSWORD: ci-owner-password
          M04_MIGRATION_TEST_APP_PASSWORD: ci-app-password
          M4_UPGRADE_TEST_DB_URL: jdbc:postgresql://localhost:5432/dental_m4_upgrade
          M4_UPGRADE_TEST_DB_USER: postgres
          M4_UPGRADE_TEST_DB_PASSWORD: ci-owner-password
          M25_UPGRADE_TEST_DB_URL: jdbc:postgresql://localhost:5432/dental_m25_upgrade
          M25_UPGRADE_TEST_DB_PASSWORD: ci-owner-password
          M310_UPGRADE_TEST_DB_URL: jdbc:postgresql://localhost:5432/dental_m310_upgrade
          M310_UPGRADE_TEST_DB_PASSWORD: ci-owner-password
          M310_SCHEDULING_TEST_DB_URL: jdbc:postgresql://localhost:5432/dental_m310_scheduling
          M310_SCHEDULING_TEST_OWNER_PASSWORD: ci-owner-password
          M310_SCHEDULING_TEST_APP_PASSWORD: ci-app-password
        run: mvn -B -ntp clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The browser suite is fully offline: it starts its own Vite dev server with a synthetic Google
  # client ID and intercepts every network call, so it needs no secrets and never touches a backend.
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            docs/evidence/m1_4_1/
            frontend/test-results/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Gitleaks compares the pushed range with its parent; fetch history so that
      # the base commit exists in the runner's shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scan commits introduced relative to main, across all merge parents,
      # plus the entire current working tree. Avoid rescanning already-fixed
      # historical test fixtures inherited from accepted main/M5 branches.
      - name: Scan new commits and complete working tree with Gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          echo "Gitleaks new-commit range: ${base}..HEAD"
          docker run --rm -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --log-opts="${base}..HEAD" --redact --exit-code 2
          docker run --rm -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --no-git --redact --exit-code 2
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request' && vars.RUN_DEPENDENCY_REVIEW == 'true'

  # Long: downloads the NVD catalog. Runs only when an NVD_API_KEY repository secret is configured,
  # because anonymously throttled NVD downloads routinely exceed the job time limit.
  owasp:
    runs-on: ubuntu-latest
    if: vars.RUN_OWASP_SCAN == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Require NVD API key for certification scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo 'NVD_API_KEY secret is missing; cannot certify Maven dependency advisories.' >&2
            exit 1
          fi
      - name: OWASP dependency-check (backend)
        working-directory: backend
        run: >
          mvn -B -ntp org.owasp:dependency-check-maven:12.1.6:check
          -DfailBuildOnCVSS=7 -DfailOnError=true -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DconnectionTimeout=10000 -DreadTimeout=60000 -DnvdMaxRetryCount=5
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.html
          retention-days: 14

  # Authenticated real-backend odontogram regression with disposable PostgreSQL and
  # local synthetic Google JWKS. No real accounts, patient data or provider credentials.
  m4-clinical-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dental
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dental"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build Spring Boot
        working-directory: backend
        run: mvn -B -ntp clean package -DskipTests
      - name: Real-backend synthetic M4 browser regression
        run: bash scripts/m4_live_e2e.sh
        env:
          M4_PG_PASSWORD: ci-owner-password
          M4_APP_PASSWORD: ci-app-password
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: m4-clinical-browser-debug
          path: frontend/test-results-m4-live
          retention-days: 7
