groups:
  - name: dental-clinic-saas
    rules:
      - alert: DentalClinicBackendUnavailable
        expr: up{job="dental-clinic-backend"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Dental Clinic backend scrape unavailable"
      - alert: DentalClinicHighHttp5xx
        expr: sum(rate(http_server_requests_seconds_count{job="dental-clinic-backend",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="dental-clinic-backend"}[5m])), 0.001) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "High server error ratio"
